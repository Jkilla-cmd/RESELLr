<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comix Stash — Log In</title>
<script>
(function(){
  try{
    var saved = JSON.parse(localStorage.getItem("resellr_v300_data"));
    var theme = (saved && saved.theme) ? saved.theme
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  }catch(e){}
})();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#e0a63f" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand login-brand-center">
      <svg class="brand-bubble" viewBox="0 0 300 205" aria-hidden="true">
        <path d="M22 30 Q22 14 38 14 L262 14 Q278 14 278 30 L278 130 Q278 146 262 146 L96 146 L55 190 L66 146 L38 146 Q22 146 22 130 Z" fill="#fff" stroke="#12161c" stroke-width="9" stroke-linejoin="round"/>
        <text x="150" y="82" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#12161c" letter-spacing="1">COMIX</text>
        <text x="150" y="126" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#e0a63f" letter-spacing="1">STASH</text>
      </svg>
    </div>

    <form id="loginForm">
      <label class="field-label">Email
        <input id="loginEmail" type="email" required autocomplete="username" />
      </label>
      <label class="field-label">Password
        <input id="loginPassword" type="password" required autocomplete="current-password" />
      </label>
      <p id="loginError" class="login-error" hidden></p>
      <button type="submit" class="primary" id="loginSubmitBtn">Log In</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="signin.js"></script>
</body>
</html>
