<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RESELLr — Log In</title>
<script>
(function(){
  try{
    var saved = JSON.parse(localStorage.getItem("resellr_v300_data"));
    var theme = (saved && saved.theme) ? saved.theme
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="mascot-wrap">
      <svg class="mascot" id="batMascot" viewBox="0 0 300 220" aria-hidden="true">
        <path d="M92 55 L62 -10 L118 48 Z" fill="#12161c"/>
        <path d="M208 55 L238 -10 L182 48 Z" fill="#12161c"/>
        <ellipse cx="150" cy="120" rx="92" ry="80" fill="#12161c"/>
        <ellipse cx="118" cy="128" rx="24" ry="17" fill="#fff"/>
        <ellipse cx="182" cy="128" rx="24" ry="17" fill="#fff"/>
        <circle class="bat-pupil bat-pupil-left" cx="118" cy="128" r="9" fill="#12161c"/>
        <circle class="bat-pupil bat-pupil-right" cx="182" cy="128" r="9" fill="#12161c"/>
        <ellipse class="bat-cover bat-cover-left" cx="118" cy="128" rx="30" ry="23" fill="#0d1117"/>
        <ellipse class="bat-cover bat-cover-right" cx="182" cy="128" rx="30" ry="23" fill="#0d1117"/>
      </svg>
    </div>
    <div class="login-brand">
      <div class="brand-mark">R</div>
      <div>
        <strong>RESELLr</strong>
        <span>Business OS</span>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to access your inventory.</p>

    <form id="loginForm">
      <label class="field-label">Email
        <input id="loginEmail" type="email" required autocomplete="username" />
      </label>
      <label class="field-label">Password
        <input id="loginPassword" type="password" required autocomplete="current-password" />
      </label>
      <p id="loginError" class="login-error" hidden></p>
      <button type="submit" class="primary" id="loginSubmitBtn">Log In</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
