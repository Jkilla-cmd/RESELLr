<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RESELLr — Log In</title>
<script>
(function(){
  try{
    var saved = JSON.parse(localStorage.getItem("resellr_v300_data"));
    var theme = (saved && saved.theme) ? saved.theme
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="mascot-wrap">
      <svg class="mascot" id="robotMascot" viewBox="0 0 300 220" aria-hidden="true">
        <line x1="150" y1="45" x2="150" y2="14" stroke="#2b323c" stroke-width="7" stroke-linecap="round"/>
        <circle cx="150" cy="11" r="9" fill="#e0a63f"/>
        <circle cx="62" cy="112" r="6" fill="#3a4552"/>
        <circle cx="238" cy="112" r="6" fill="#3a4552"/>
        <rect x="55" y="45" width="190" height="135" rx="28" fill="#2b323c"/>
        <rect x="76" y="66" width="148" height="96" rx="16" fill="#12161c"/>
        <circle cx="118" cy="114" r="27" fill="#1a1f26" stroke="#3a4552" stroke-width="4"/>
        <circle cx="182" cy="114" r="27" fill="#1a1f26" stroke="#3a4552" stroke-width="4"/>
        <circle class="bot-pupil bot-pupil-left" cx="118" cy="114" r="12" fill="#e0a63f"/>
        <circle class="bot-pupil bot-pupil-right" cx="182" cy="114" r="12" fill="#e0a63f"/>
        <rect x="128" y="145" width="10" height="4" rx="2" fill="#3a4552"/>
        <rect x="145" y="145" width="10" height="4" rx="2" fill="#3a4552"/>
        <rect x="162" y="145" width="10" height="4" rx="2" fill="#3a4552"/>
        <rect class="bot-shutter bot-shutter-left" x="88" y="84" width="60" height="60" rx="10" fill="#2b323c"/>
        <rect class="bot-shutter bot-shutter-right" x="152" y="84" width="60" height="60" rx="10" fill="#2b323c"/>
      </svg>
    </div>
    <div class="login-brand">
      <div class="brand-mark">R</div>
      <div>
        <strong>RESELLr</strong>
        <span>Business OS</span>
      </div>
    </div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to access your inventory.</p>

    <form id="loginForm">
      <label class="field-label">Email
        <input id="loginEmail" type="email" required autocomplete="username" />
      </label>
      <label class="field-label">Password
        <input id="loginPassword" type="password" required autocomplete="current-password" />
      </label>
      <p id="loginError" class="login-error" hidden></p>
      <button type="submit" class="primary" id="loginSubmitBtn">Log In</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
